# Raccolta prezzi automatica sui runner GitHub: gira a PC spento.
#
# I segreti (token CardTrader, credenziali SMTP, Telegram) NON stanno qui:
# si impostano una volta in Settings -> Secrets and variables -> Actions
# del repository, e il workflow li legge come variabili d'ambiente.
#
# DOVE VIVE IL DATABASE, e perche' non su main.
#
# Lo storico deve sopravvivere fra un ciclo e l'altro, altrimenti ogni run
# ripartirebbe da zero: la regola di calo nel tempo non si accenderebbe mai e
# le stesse segnalazioni verrebbero rimandate in continuazione. La prima
# versione di questo workflow lo committava su main a ogni ciclo, ed era
# insostenibile: git non sa fare delta fra due versioni di un file SQLite,
# quindi ogni commit ristorava il file intero (circa 275 KB compressi). A
# 5 minuti sono 288 commit al giorno, e la cronologia del repository avrebbe
# superato i limiti di GitHub in pochi giorni.
#
# Ora il file viaggia su tre binari, con ruoli diversi:
#
#   1. cache di Actions  -> continuita' fra un ciclo e il successivo
#   2. artifact del run  -> da qui il PC si allinea (python -m pricedrop sync)
#   3. branch "dati"     -> copia durevole, un commit al giorno
#
# La cronologia git cresce cosi' di un commit al giorno invece di 288, e su un
# branch separato: main non contiene il database, quindi la dashboard locale
# puo' scriverci senza che git pull vada in conflitto a ogni giro.
name: Raccolta prezzi

on:
  schedule:
    # Ogni 5 minuti: e' il minimo consentito da GitHub. Resta "best effort",
    # quindi nelle ore di punta un ciclo puo' partire in ritardo o essere
    # saltato: i cicli effettivi sono meno di 288 al giorno.
    - cron: "*/5 * * * *"
  # Permette di lanciare una raccolta a mano dalla tab Actions.
  workflow_dispatch:

# Serve per il commit giornaliero sul branch dati.
permissions:
  contents: write

# Due raccolte in parallelo sprecherebbero chiamate API e si scontrerebbero
# sulla cache: i cicli si mettono in coda invece di sovrapporsi.
concurrency:
  group: raccolta
  cancel-in-progress: false

env:
  DB: data/pricedrop.db
  BRANCH_DATI: dati

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      # La chiave cambia a ogni run, cosi' il post-step salva sempre una voce
      # nuova; restore-keys ripesca la piu' recente di quelle precedenti.
      - name: Riprendi il database dalla cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DB }}
          key: database-${{ github.run_id }}
          restore-keys: |
            database-

      # Se la cache e' stata sfrattata (succede dopo 7 giorni di inattivita', o
      # oltre i 10 GB per repository) lo storico si recupera dal branch dati,
      # perdendo al massimo i cicli della giornata in corso.
      - name: Recupera lo storico dal branch dati
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          if git fetch origin "$BRANCH_DATI" 2>/dev/null; then
            mkdir -p data
            if git show "origin/$BRANCH_DATI:$DB" > "$DB" 2>/dev/null; then
              echo "Storico recuperato dal branch $BRANCH_DATI."
            else
              echo "Il branch $BRANCH_DATI non contiene il database: si parte da zero."
              rm -f "$DB"
            fi
          else
            echo "Nessun branch $BRANCH_DATI: si parte da zero."
          fi

      - name: Raccogli i prezzi e invia le notifiche
        env:
          CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          DATABASE_PATH: ${{ env.DB }}
        run: python -m pricedrop collect

      - name: Consolida il database
        # Il database usa il journal WAL: il checkpoint riversa tutto nel file
        # principale, cosi' artifact e cache contengono davvero i dati
        # dell'ultimo ciclo.
        run: |
          python - <<'PY'
          import os, sqlite3
          conn = sqlite3.connect(os.environ["DB"])
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.close()
          PY

      # Da qui si allinea il PC: `python -m pricedrop sync` scarica l'artifact
      # dell'ultimo ciclo riuscito. Gli artifact non pesano sulla cronologia
      # git, e su repository pubblico lo spazio e' gratuito.
      - name: Pubblica il database come artifact
        uses: actions/upload-artifact@v4
        with:
          name: database
          path: ${{ env.DB }}
          # Una settimana basta: serve solo come punto di scarico recente.
          retention-days: 7
          compression-level: 9
          overwrite: true

      - name: Aggiorna la copia durevole, una volta al giorno
        run: |
          oggi=$(date -u '+%Y-%m-%d')
          git fetch origin "$BRANCH_DATI" 2>/dev/null || true
          ultimo=""
          if git rev-parse --verify "origin/$BRANCH_DATI" >/dev/null 2>&1; then
            ultimo=$(git log -1 --format=%cd --date=format:%Y-%m-%d "origin/$BRANCH_DATI")
          fi
          if [ "$ultimo" = "$oggi" ]; then
            echo "Copia durevole di oggi ($oggi) gia' presente: niente commit."
            exit 0
          fi
          echo "Aggiorno il branch $BRANCH_DATI per il giorno $oggi."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Il branch dati tiene un solo commit: non serve la storia di tutti i
          # giorni, serve l'ultima copia buona. Un branch orfano ricreato ogni
          # volta tiene il repository piccolo per sempre.
          git checkout --orphan "$BRANCH_DATI"
          git reset
          git add -f "$DB"
          git commit -q -m "Database al $oggi"
          git push -f origin "HEAD:$BRANCH_DATI"
