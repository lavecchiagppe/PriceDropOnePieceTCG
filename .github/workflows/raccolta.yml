# Raccolta prezzi automatica sui runner GitHub: gira a PC spento.
#
# I segreti (token CardTrader, credenziali SMTP, Telegram) NON stanno qui:
# si impostano una volta in Settings -> Secrets and variables -> Actions
# del repository, e il workflow li legge come variabili d'ambiente.
#
# PERCHE' IL JOB SI DA' LA FREQUENZA DA SOLO.
#
# La prima versione usava `cron: */5`, il minimo consentito. GitHub lo ha
# semplicemente ignorato: workflow attivo, cron valido, Actions abilitato, e
# in cinquanta minuti nemmeno un run pianificato. E' un comportamento noto e
# documentato: i run `schedule` sono "best effort", vengono accodati e sotto
# carico scartati, e gli intervalli brevi sono i primi a saltare.
#
# Quindi il cron chiede poco e il job fa il resto: parte ogni 15 minuti, e
# dentro allo stesso job raccoglie tre volte a 5 minuti di distanza. Le
# rilevazioni restano una ogni 5 minuti, ma dipendono da un terzo delle
# occasioni di essere ritardate o saltate. Le attese dentro al job non
# costano nulla: su repository pubblico i minuti sono illimitati.
#
# DOVE VIVE IL DATABASE, e perche' non su main.
#
# Lo storico deve sopravvivere fra un ciclo e l'altro, altrimenti ogni run
# ripartirebbe da zero: la regola di calo nel tempo non si accenderebbe mai e
# le stesse segnalazioni verrebbero rimandate in continuazione. Committarlo su
# main a ogni ciclo, come faceva la prima versione, era insostenibile: git non
# sa fare delta fra due file SQLite, quindi ogni commit ristora il file intero
# (~275 KB compressi).
#
# Il file viaggia su tre binari, con ruoli distinti:
#
#   1. cache di Actions  -> continuita' fra un run e il successivo
#   2. artifact          -> riscritto a ogni rilevazione; da qui si allinea
#                           il PC con `python -m pricedrop sync`
#   3. branch "dati"     -> copia durevole, un commit al giorno
#
# Su main il database non c'e': la dashboard locale ci scrive, e un file
# versionato manderebbe in conflitto ogni git pull.
name: Raccolta prezzi

on:
  schedule:
    # Un quarto d'ora e' un intervallo che lo scheduler onora molto piu'
    # volentieri di `*/5`. Le tre rilevazioni le fa il job.
    # Il minuto 3 invece di 0: all'inizio dell'ora la coda di GitHub e' piu'
    # affollata, ed e' il consiglio della documentazione per ridurre i ritardi.
    - cron: "3,18,33,48 * * * *"
  # Permette di lanciare una raccolta a mano dalla tab Actions.
  workflow_dispatch:

# Serve per il commit giornaliero sul branch dati.
permissions:
  contents: write

# Due run in parallelo sprecherebbero chiamate API e si scontrerebbero sulla
# cache: si mettono in coda invece di sovrapporsi. Il job dura circa 11
# minuti, quindi sta comodamente dentro il quarto d'ora.
concurrency:
  group: raccolta
  cancel-in-progress: false

jobs:
  raccolta:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # L'env del job: gli step, comprese le azioni composite, lo ereditano.
    env:
      DB: data/pricedrop.db
      BRANCH_DATI: dati
      CARDTRADER_API_TOKEN: ${{ secrets.CARDTRADER_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      # restore + save separati, non `actions/cache`: serve sapere SE la cache
      # e' stata ripresa, e solo `actions/cache/restore` espone
      # `cache-matched-key`. Con `actions/cache` quell'output e' sempre vuoto,
      # quindi lo step di recupero qui sotto girava a ogni run e sovrascriveva
      # la cache appena ripresa con la copia giornaliera: lo storico raccolto
      # dai run precedenti della stessa giornata andava perso ogni volta.
      #
      # La chiave cambia a ogni run, cosi' il salvataggio finale aggiunge
      # sempre una voce nuova; restore-keys ripesca la piu' recente fra quelle
      # dei run precedenti.
      - name: Riprendi il database dalla cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DB }}
          key: database-${{ github.run_id }}
          restore-keys: |
            database-

      # Se la cache e' stata sfrattata (dopo 7 giorni di inattivita', o oltre i
      # 10 GB per repository) lo storico si recupera dal branch dati, perdendo
      # al massimo i cicli della giornata in corso.
      - name: Recupera lo storico dal branch dati
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          if git fetch origin "$BRANCH_DATI" 2>/dev/null; then
            mkdir -p data
            if git show "origin/$BRANCH_DATI:$DB" > "$DB" 2>/dev/null; then
              echo "Storico recuperato dal branch $BRANCH_DATI."
            else
              echo "Il branch $BRANCH_DATI non contiene il database: si parte da zero."
              rm -f "$DB"
            fi
          else
            echo "Nessun branch $BRANCH_DATI: si parte da zero."
          fi

      - name: Rilevazione 1 di 3
        uses: ./.github/actions/raccogli
        with:
          database: ${{ env.DB }}

      - name: Attendi 5 minuti
        run: sleep 300

      - name: Rilevazione 2 di 3
        uses: ./.github/actions/raccogli
        with:
          database: ${{ env.DB }}

      - name: Attendi 5 minuti
        run: sleep 300

      - name: Rilevazione 3 di 3
        uses: ./.github/actions/raccogli
        with:
          database: ${{ env.DB }}

      # Il salvataggio e' esplicito e `always()`: se una rilevazione fallisce a
      # meta' job, lo storico raccolto fino a quel punto non va perso.
      - name: Salva il database nella cache
        if: always() && hashFiles(env.DB) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DB }}
          key: database-${{ github.run_id }}

      - name: Aggiorna la copia durevole, una volta al giorno
        # Gira anche se una rilevazione e' fallita: meglio salvare lo storico
        # raccolto fin li' che perdere la giornata per un errore di rete.
        if: always()
        run: |
          if [ ! -f "$DB" ]; then
            echo "Nessun database da salvare."
            exit 0
          fi
          oggi=$(date -u '+%Y-%m-%d')
          git fetch origin "$BRANCH_DATI" 2>/dev/null || true
          ultimo=""
          if git rev-parse --verify "origin/$BRANCH_DATI" >/dev/null 2>&1; then
            ultimo=$(git log -1 --format=%cd --date=format:%Y-%m-%d "origin/$BRANCH_DATI")
          fi
          if [ "$ultimo" = "$oggi" ]; then
            echo "Copia durevole di oggi ($oggi) gia' presente: niente commit."
            exit 0
          fi
          echo "Aggiorno il branch $BRANCH_DATI per il giorno $oggi."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Il branch dati tiene un solo commit: serve l'ultima copia buona,
          # non la storia di tutti i giorni. Un branch orfano ricreato ogni
          # volta tiene il repository piccolo per sempre.
          git checkout --orphan "$BRANCH_DATI"
          git reset
          git add -f "$DB"
          git commit -q -m "Database al $oggi"
          git push -f origin "HEAD:$BRANCH_DATI"
